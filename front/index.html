<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team Task Manager</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <h2>Team Task Manager</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="loginUser()">Login</button>

    <hr>

    <input type="text" id="taskTitle" placeholder="Enter Task Title">

    <input type="text" id="assignedTo" placeholder="Assign To">

    <input type="date" id="dueDate">

    <select id="status">

      <option value="pending">Pending</option>

      <option value="in-progress">In Progress</option>

      <option value="completed">Completed</option>

    </select>

    <button onclick="createTask()">Create Task</button>

    <button onclick="getTasks()">Refresh Tasks</button>

    <h3>Dashboard</h3>

    <p>Total Tasks: <span id="totalTasks">0</span></p>

    <p>Pending Tasks: <span id="pendingTasks">0</span></p>

    <p>Completed Tasks: <span id="completedTasks">0</span></p>

    <p>Overdue Tasks: <span id="overdueTasks">0</span></p>

    <h3>Tasks</h3>

    <ul id="taskList"></ul>

  </div>

  <script src="app.js"></script>

</body>

</html>
